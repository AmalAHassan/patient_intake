name: CI

on:
  push:
    branches: [dev2, main]
  pull_request:
    branches: [dev2, main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: patient-intake/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        working-directory: patient-intake/backend
        env:
          ANTHROPIC_API_KEY: dummy-key-for-ci
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
          STRIPE_MCP_RESTRICTED_KEY: rk_test_dummy
          RESEND_API_KEY: dummy
        run: |
          python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: patient-intake/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: patient-intake/frontend
        run: npm ci

      - name: Build frontend
        working-directory: patient-intake/frontend
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com
        run: npm run build
